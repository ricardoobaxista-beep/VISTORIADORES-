<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard Vistoriadores — BEQ</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chartjs-plugin-datalabels/2.2.0/chartjs-plugin-datalabels.min.js"></script>
<script>
  // Register datalabels plugin globally - must run before any chart is created
  if (window.Chart && window.ChartDataLabels) {
    Chart.register(ChartDataLabels);
  }
</script>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0e1a;
    --surface: #111827;
    --surface2: #1a2236;
    --border: #1e2d45;
    --accent: #00d4ff;
    --accent2: #ff6b35;
    --accent3: #7c3aed;
    --green: #10b981;
    --red: #ef4444;
    --yellow: #f59e0b;
    --text: #e2e8f0;
    --muted: #64748b;
    --font-head: 'Syne', sans-serif;
    --font-body: 'DM Sans', sans-serif;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-body);
    min-height: 100vh;
    display: flex;
    overflow-x: hidden;
    background-image: radial-gradient(ellipse at 20% 10%, rgba(0,212,255,0.05) 0%, transparent 50%),
                      radial-gradient(ellipse at 80% 80%, rgba(124,58,237,0.05) 0%, transparent 50%);
  }

  /* ── SIDEBAR ── */
  .sidebar {
    width: 180px;
    min-width: 180px;
    background: #0d1320;
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    padding: 28px 0 24px;
    position: sticky;
    top: 0;
    height: 100vh;
    overflow-y: auto;
    overflow-x: hidden;
    flex-shrink: 0;
  }
  .sidebar-logo {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 8px 0 18px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 20px;
    position: relative;
    min-height: 182px;
  }

  /* Container geral */
  .logo-scene {
    position: relative;
    width: 172px;
    height: 172px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* Mapa SVG de fundo — grande e visível */
  .logo-map {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 0;
  }

  /* Anel giratório externo — ao redor de todo o mapa */
  .logo-ring {
    position: absolute;
    inset: 4px;
    border-radius: 50%;
    background: conic-gradient(from 0deg, #00d4ff, #7c3aed, #00ffcc, transparent, #00d4ff);
    animation: logoSpin 6s linear infinite;
    opacity: 0.45;
    z-index: 1;
  }
  .logo-ring::after {
    content: '';
    position: absolute;
    inset: 3px;
    border-radius: 50%;
    background: #0d1320;
  }
  @keyframes logoSpin {
    from { transform: rotate(0deg); }
    to   { transform: rotate(360deg); }
  }

  /* Segundo anel — tracejado rotação inversa, levemente menor */
  .logo-ring2 {
    position: absolute;
    inset: 12px;
    border-radius: 50%;
    border: 1px dashed rgba(0,212,255,0.28);
    animation: logoSpinRev 12s linear infinite;
    z-index: 1;
  }
  @keyframes logoSpinRev {
    from { transform: rotate(0deg); }
    to   { transform: rotate(-360deg); }
  }

  /* Pulso de fundo */
  .logo-pulse {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(0,212,255,0.12) 0%, transparent 70%);
    animation: logoPulse 2.5s ease-in-out infinite;
    z-index: 0;
  }
  @keyframes logoPulse {
    0%, 100% { transform: scale(0.9); opacity: 0.5; }
    50%       { transform: scale(1.15); opacity: 1; }
  }

  /* Prancheta sobre Fortaleza */
  .logo-clipboard {
    position: absolute;
    /* Fortaleza = cx:80 cy:66 no viewBox 160x160 → escala 172/160 ≈ 1.075 → ~86px, ~71px */
    left: 64px;
    top: 48px;
    z-index: 3;
    filter:
      drop-shadow(0 0 9px rgba(0,212,255,1))
      drop-shadow(0 0 20px rgba(124,58,237,0.65))
      drop-shadow(0 0 34px rgba(0,212,255,0.28));
    animation: clipFloat 3s ease-in-out infinite;
  }
  @keyframes clipFloat {
    0%, 100% { transform: translateY(0px); }
    50%       { transform: translateY(-4px); }
  }

  /* Rotas animadas */
  .map-rt {
    fill: none;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  @keyframes drawRt {
    0%   { stroke-dashoffset: 200; opacity: 0; }
    15%  { opacity: 1; }
    55%  { stroke-dashoffset: 0; opacity: 1; }
    85%  { stroke-dashoffset: 0; opacity: 0.4; }
    100% { stroke-dashoffset: -200; opacity: 0; }
  }
  /* Pontos dos municípios */
  @keyframes dotPop {
    0%,100% { r: 2.5; opacity: 0.5; }
    50%     { r: 4;   opacity: 1;   }
  }
  /* Vistoriadores móveis */
  @keyframes mov1 { 0%{offset-distance:0%;opacity:0} 10%{opacity:1} 90%{opacity:1} 100%{offset-distance:100%;opacity:0} }
  @keyframes mov2 { 0%{offset-distance:0%;opacity:0} 10%{opacity:1} 90%{opacity:1} 100%{offset-distance:100%;opacity:0} }
  @keyframes mov3 { 0%{offset-distance:0%;opacity:0} 10%{opacity:1} 90%{opacity:1} 100%{offset-distance:100%;opacity:0} }

  .sidebar-logo-text { display: none; }
  .sidebar-logo-sub  { display: none; }
  .sidebar-section-label {
    font-size: 0.65rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: var(--muted);
    padding: 0 20px;
    margin: 8px 0 4px;
  }
  .sidebar-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 11px 16px;
    margin: 2px 10px;
    border-radius: 10px;
    cursor: pointer;
    font-size: 0.875rem;
    font-weight: 500;
    color: var(--muted);
    border: 1px solid transparent;
    background: transparent;
    width: calc(100% - 20px);
    text-align: left;
    font-family: var(--font-body);
    transition: all 0.18s;
  }
  .sidebar-item:hover { background: rgba(255,255,255,0.05); color: var(--text); }
  .sidebar-item.active { background: rgba(0,212,255,0.08); border-color: rgba(0,212,255,0.25); color: var(--accent); }
  .sidebar-item.active-cancel { background: rgba(239,68,68,0.08); border-color: rgba(239,68,68,0.25); color: var(--red); }
  .sidebar-item .s-icon { font-size: 1.1rem; width: 22px; text-align: center; flex-shrink: 0; }
  .sidebar-divider { height: 1px; background: var(--border); margin: 14px 20px; }
  .sidebar-bottom { margin-top: auto; padding: 0 12px; }
  .sidebar-credits {
    margin: 0 10px 4px;
    padding: 12px 14px;
    border-top: 1px solid var(--border);
    text-align: center;
  }
  .sidebar-credits-name {
    font-family: var(--font-head);
    font-size: 0.72rem;
    font-weight: 700;
    background: linear-gradient(135deg, #fff 0%, var(--accent) 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    letter-spacing: 0.3px;
    margin-bottom: 4px;
  }
  .sidebar-credits-sub {
    font-size: 0.62rem;
    color: var(--muted);
    letter-spacing: 0.3px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    white-space: nowrap;
  }
  .sidebar-credits-sub span.sep {
    color: var(--border);
    font-size: 0.8rem;
  }
  .sidebar-upload-btn {
    width: 100%;
    padding: 10px 14px;
    background: rgba(0,212,255,0.08);
    border: 1px solid rgba(0,212,255,0.25);
    border-radius: 10px;
    color: var(--accent);
    font-family: var(--font-body);
    font-size: 0.82rem;
    font-weight: 600;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 8px;
    transition: all 0.2s;
  }
  .sidebar-upload-btn:hover { background: rgba(0,212,255,0.16); border-color: rgba(0,212,255,0.5); }
  .sidebar-filename {
    font-size: 0.68rem;
    color: var(--green);
    padding: 6px 2px 0;
    text-align: center;
    word-break: break-all;
    min-height: 18px;
  }

  /* ── MAIN CONTENT ── */
  .main-content { flex: 1; min-width: 0; padding: 28px; overflow-x: hidden; }

  @media (max-width: 768px) {
    .sidebar { width: 64px; min-width: 64px; }
    .sidebar-logo-text, .sidebar-logo-sub, .sidebar-section-label,
    .sidebar-item span:not(.s-icon), .sidebar-upload-btn span:last-child { display: none; }
    .sidebar-item { justify-content: center; padding: 11px; }
    .main-content { padding: 16px; }
  }

  /* HEADER */
  .header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 28px;
    padding-bottom: 20px;
    border-bottom: 1px solid var(--border);
  }
  .header-left h1 {
    font-family: var(--font-head);
    font-size: 2rem;
    font-weight: 800;
    letter-spacing: -0.5px;
    background: linear-gradient(135deg, #fff 0%, var(--accent) 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .header-left p {
    color: var(--muted);
    font-size: 0.875rem;
    margin-top: 4px;
  }
  .badge {
    background: rgba(0,212,255,0.1);
    border: 1px solid rgba(0,212,255,0.3);
    color: var(--accent);
    font-size: 0.75rem;
    font-weight: 600;
    padding: 4px 12px;
    border-radius: 20px;
    letter-spacing: 0.5px;
  }

  /* UPLOAD AREA */
  .upload-zone {
    border: 2px dashed var(--border);
    border-radius: 16px;
    padding: 32px;
    text-align: center;
    background: var(--surface);
    cursor: pointer;
    transition: all 0.2s;
    margin-bottom: 32px;
    position: relative;
    overflow: hidden;
  }
  .upload-zone:hover { border-color: var(--accent); background: rgba(0,212,255,0.03); }
  .upload-zone.active { border-color: var(--green); background: rgba(16,185,129,0.05); }
  .upload-zone input[type=file] { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
  .upload-zone .icon { font-size: 2.5rem; margin-bottom: 12px; }
  .upload-zone h3 { font-family: var(--font-head); font-size: 1rem; font-weight: 700; margin-bottom: 6px; }
  .upload-zone p { color: var(--muted); font-size: 0.8rem; }
  .upload-zone .filename { color: var(--green); font-weight: 600; margin-top: 8px; font-size: 0.85rem; }

  /* DATE FILTER */
  .filters {
    display: flex;
    gap: 12px;
    align-items: center;
    margin-bottom: 28px;
    flex-wrap: wrap;
  }
  .filter-label { color: var(--muted); font-size: 0.8rem; font-weight: 500; }
  .date-btn {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 8px 16px;
    border-radius: 8px;
    cursor: pointer;
    font-family: var(--font-body);
    font-size: 0.8rem;
    transition: all 0.15s;
  }
  .date-btn:hover { border-color: var(--accent); color: var(--accent); }
  .date-btn.active { background: var(--accent); color: var(--bg); border-color: var(--accent); font-weight: 600; }
  input[type=date] {
    background: var(--surface2);
    border: 1px solid rgba(0,212,255,0.3);
    color: var(--text);
    padding: 8px 14px;
    border-radius: 8px;
    font-family: var(--font-body);
    font-size: 0.8rem;
    cursor: pointer;
    outline: none;
    color-scheme: dark;
  }
  input[type=date]:focus { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(0,212,255,0.15); }
  input[type=date]::-webkit-calendar-picker-indicator {
    filter: brightness(0) saturate(100%) invert(85%) sepia(80%) saturate(600%) hue-rotate(160deg) brightness(1.4);
    opacity: 1;
    cursor: pointer;
    transform: scale(1.4);
  }

  /* KPI CARDS */
  .kpi-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    gap: 16px;
    margin-bottom: 28px;
  }
  .kpi-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 20px;
    position: relative;
    overflow: hidden;
    transition: transform 0.2s;
  }
  .kpi-card:hover { transform: translateY(-2px); }
  .kpi-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    border-radius: 16px 16px 0 0;
  }
  .kpi-card.blue::before { background: var(--accent); }
  .kpi-card.orange::before { background: var(--accent2); }
  .kpi-card.green::before { background: var(--green); }
  .kpi-card.red::before { background: var(--red); }
  .kpi-card.purple::before { background: var(--accent3); }
  .kpi-label { font-size: 0.7rem; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); margin-bottom: 8px; }
  .kpi-value {
    font-family: var(--font-head);
    font-size: 2.2rem;
    font-weight: 800;
    line-height: 1;
  }
  .kpi-card.blue .kpi-value { color: var(--accent); }
  .kpi-card.orange .kpi-value { color: var(--accent2); }
  .kpi-card.green .kpi-value { color: var(--green); }
  .kpi-card.red .kpi-value { color: var(--red); }
  .kpi-card.purple .kpi-value { color: var(--accent3); }
  .kpi-sub { font-size: 0.75rem; color: var(--muted); margin-top: 4px; }

  /* CHARTS GRID */
  .charts-row {
    display: grid;
    gap: 20px;
    margin-bottom: 20px;
  }
  .charts-row.two { grid-template-columns: 1fr 1fr; }
  .charts-row.three { grid-template-columns: 2fr 1fr; }
  .charts-row.full { grid-template-columns: 1fr; }
  @media (max-width: 900px) {
    .charts-row.two, .charts-row.three { grid-template-columns: 1fr; }
  }

  .chart-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 18px 20px;
    position: relative;
  }
  .chart-title {
    font-family: var(--font-head);
    font-size: 0.95rem;
    font-weight: 700;
    margin-bottom: 4px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .chart-title .dot {
    width: 8px; height: 8px; border-radius: 50%;
    display: inline-block;
  }
  .chart-sub { color: var(--muted); font-size: 0.75rem; margin-bottom: 20px; }
  .chart-wrap { position: relative; }

  /* TABLE */
  .table-wrap { overflow-x: auto; }
  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.82rem;
  }
  thead th {
    background: var(--surface2);
    color: var(--muted);
    font-size: 0.68rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.8px;
    padding: 8px 12px;
    text-align: left;
    white-space: nowrap;
  }
  tbody tr {
    border-bottom: 1px solid var(--border);
    transition: background 0.15s;
  }
  tbody tr:hover { background: rgba(255,255,255,0.03); }
  tbody td { padding: 7px 12px; vertical-align: middle; white-space: normal; word-break: break-word; font-size: 0.80rem; line-height: 1.35; }
  .name-cell { font-weight: 600; font-size: 0.82rem; min-width: 110px; }
  .badge-pill {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 3px 10px;
    border-radius: 20px;
    font-size: 0.72rem;
    font-weight: 600;
    white-space: nowrap;
  }
  .pill-green { background: rgba(16,185,129,0.15); color: var(--green); }
  .pill-red { background: rgba(239,68,68,0.15); color: var(--red); }
  .pill-yellow { background: rgba(245,158,11,0.15); color: var(--yellow); }
  .pill-blue { background: rgba(0,212,255,0.12); color: var(--accent); }
  .progress-bar {
    background: var(--surface2);
    border-radius: 4px;
    height: 6px;
    min-width: 80px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    border-radius: 4px;
    background: var(--green);
    transition: width 0.5s ease;
  }

  /* EMPTY STATE */
  .empty-state {
    text-align: center;
    padding: 60px 20px;
    color: var(--muted);
  }
  .empty-state .emoji { font-size: 3rem; margin-bottom: 16px; }
  .empty-state h3 { font-family: var(--font-head); font-size: 1.1rem; margin-bottom: 8px; color: var(--text); }

  /* FOOTER */
  footer {
    text-align: center;
    color: var(--muted);
    font-size: 0.75rem;
    margin-top: 40px;
    padding-top: 20px;
    border-top: 1px solid var(--border);
  }

  .section-divider {
    font-family: var(--font-head);
    font-size: 0.7rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 2px;
    color: var(--muted);
    margin: 28px 0 16px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .section-divider::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--border);
  }

  .no-data { color: var(--muted); font-style: italic; }

  /* TABS */
  .tab-nav {
    display: flex;
    gap: 4px;
    margin-bottom: 28px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 6px;
    width: fit-content;
  }
  .tab-btn {
    padding: 10px 24px;
    border-radius: 10px;
    border: none;
    cursor: pointer;
    font-family: var(--font-body);
    font-size: 0.85rem;
    font-weight: 600;
    transition: all 0.2s;
    background: transparent;
    color: var(--muted);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .tab-btn:hover { color: var(--text); background: rgba(255,255,255,0.04); }
  .tab-btn.active {
    background: var(--surface2);
    color: var(--text);
    border: 1px solid var(--border);
    box-shadow: 0 2px 8px rgba(0,0,0,0.3);
  }
  .tab-btn.tab-cancel.active { color: var(--red); border-color: rgba(239,68,68,0.3); }
  .tab-btn.tab-cancel.active .tab-dot { background: var(--red); }
  .tab-btn.tab-main.active { color: var(--accent); border-color: rgba(0,212,255,0.3); }
  .tab-btn.tab-main.active .tab-dot { background: var(--accent); }
  .tab-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); transition: background 0.2s; }
  .tab-panel { display: none; }
  .tab-panel.active { display: block; }

  /* CANCEL FILTERS */
  .cancel-filters {
    display: flex;
    gap: 10px;
    align-items: center;
    flex-wrap: wrap;
    margin-bottom: 24px;
    padding: 14px 18px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
  }
  .cancel-filters .filter-label { color: var(--muted); font-size: 0.78rem; font-weight: 600; white-space: nowrap; }
  .cf-select {
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 7px 12px;
    border-radius: 8px;
    font-family: var(--font-body);
    font-size: 0.8rem;
    cursor: pointer;
    outline: none;
    transition: border-color 0.15s;
    min-width: 140px;
  }
  .cf-select:focus { border-color: var(--red); box-shadow: 0 0 0 2px rgba(239,68,68,0.15); }
  .cf-select option { background: var(--surface2); }
  .cf-clear {
    background: rgba(239,68,68,0.1);
    border: 1px solid rgba(239,68,68,0.3);
    color: var(--red);
    padding: 7px 14px;
    border-radius: 8px;
    cursor: pointer;
    font-family: var(--font-body);
    font-size: 0.78rem;
    font-weight: 600;
    transition: all 0.15s;
    white-space: nowrap;
  }
  .cf-clear:hover { background: rgba(239,68,68,0.2); border-color: var(--red); }
  .cf-date {
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 7px 10px;
    border-radius: 8px;
    font-family: var(--font-body);
    font-size: 0.78rem;
    cursor: pointer;
    outline: none;
    color-scheme: dark;
    transition: border-color 0.15s;
  }
  .cf-date:focus { border-color: var(--red); box-shadow: 0 0 0 2px rgba(239,68,68,0.15); }
  .cf-date::-webkit-calendar-picker-indicator {
    filter: brightness(0) saturate(100%) invert(85%) sepia(80%) saturate(600%) hue-rotate(160deg) brightness(1.4);
    opacity: 1; cursor: pointer;
  }
  .cf-count {
    margin-left: auto;
    font-size: 0.75rem;
    color: var(--muted);
    white-space: nowrap;
  }
  .cf-count strong { color: var(--red); font-weight: 700; }

  .btn-print {
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.08);
    color: var(--muted);
    padding: 6px 8px;
    border-radius: 8px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s;

<script>
let rawData = [];
let filteredData = [];
let charts = {};
let activeFilter = 'all';

// ───── UPLOAD ─────
const fileInput  = document.getElementById('fileInput');
const uploadBtn  = document.getElementById('uploadBtn');

// Botão da sidebar abre o seletor de arquivo
uploadBtn.addEventListener('click', () => fileInput.click());

// Quando o usuário seleciona um arquivo
fileInput.addEventListener('change', e => handleFile(e.target.files[0]));

function setLastUpdate(source) {
  const now = new Date();
  const pad = n => String(n).padStart(2,'0');
  const str = `${pad(now.getDate())}/${pad(now.getMonth()+1)}/${now.getFullYear()} ${pad(now.getHours())}:${pad(now.getMinutes())}`;
  const badge = document.getElementById('lastUpdateBadge');
  document.getElementById('lastUpdateText').textContent = `Última atualização: ${str}${source ? ' · ' + source : ''}`;
  badge.style.display = 'flex';
}

function handleFile(file) {
  if (!file) return;
  document.getElementById('fileName').textContent = '';

  const reader = new FileReader();
  reader.onload = e => {
    const wb = XLSX.read(e.target.result, { type: 'binary', cellDates: false, raw: true });

    // ── Aba principal (RETORNOS ou primeira aba) ──
    const mainName = wb.SheetNames.find(n => n.toUpperCase().includes('RETORNO')) || wb.SheetNames[0];
    const sheet = wb.Sheets[mainName];
    const rows = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: '' });
    parseData(rows);

    // ── Aba ACOMPANHAMENTO ──
    const acompName = wb.SheetNames.find(n => n.toUpperCase().includes('ACOMPANHAMENTO'));
    if (acompName) {
      const aSheet = wb.Sheets[acompName];
      const aRows = XLSX.utils.sheet_to_json(aSheet, { header: 1, defval: '' });
      parseCancelados(aRows);
      cancelRendered = false;
    }
    setLastUpdate('arquivo local');
  };

const SHEET_CANCEL_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSRy4PgnV05mmE9tKZfHDaATnLqslR_IFRsMJR5p27HnIWLnpaGuZPPcbd6J8SFXqi9eouUrrghAPgs/pub?gid=347123293&single=true&output=csv';

// URL do Google Apps Script (preencher após criar o script)
// Instruções: https://script.google.com/home → Novo projeto → cole o código → Implantar
const GAS_URL = ''; // ex: https://script.google.com/macros/s/SEU_ID/exec

function fetchCSV(sheetUrl) {
  return new Promise((resolve, reject) => {

    // ── Modo 1: via Google Apps Script (mais confiável) ──
    if (GAS_URL) {
      const xhr = new XMLHttpRequest();
      xhr.open('GET', `${GAS_URL}?url=${encodeURIComponent(sheetUrl)}`, true);
      xhr.timeout = 15000;
      xhr.onload = () => {
        if (xhr.status === 200 && xhr.responseText.length > 10) resolve(xhr.responseText);
        else tryProxies();
      };
      xhr.onerror = xhr.ontimeout = () => tryProxies();
      xhr.send();
      return;
    }

    tryProxies();

    // ── Modo 2: proxies públicos ──
    function tryProxies() {
      const proxyList = [
        `https://corsproxy.io/?${encodeURIComponent(sheetUrl)}`,
        `https://api.allorigins.win/raw?url=${encodeURIComponent(sheetUrl)}`,
        `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(sheetUrl)}`,
        `https://proxy.cors.sh/${sheetUrl}`,
      ];
      let i = 0;
      function next() {
        if (i >= proxyList.length) {
          reject(new Error(
            'Não foi possível buscar os dados online.\n\n' +
            '📌 SOLUÇÃO: Abra o arquivo via servidor local:\n' +
            '1. Abra o Prompt de Comando na pasta do arquivo\n' +
            '2. Digite: python -m http.server 8080\n' +
            '3. Acesse: http://localhost:8080/dashboard_vistoriadores_v11.html\n\n' +
            'Ou use o botão "Atualizar Base" para importar manualmente.'
          ));
          return;
        }
        const url = proxyList[i++];
        const xhr = new XMLHttpRequest();
        xhr.open('GET', url, true);
        xhr.timeout = 10000;
        xhr.onload = () => {
          if (xhr.status === 200 && xhr.responseText && xhr.responseText.length > 10) {
            resolve(xhr.responseText);
          } else next();
        };
        xhr.onerror = xhr.ontimeout = () => next();
        xhr.send();
      }
      next();
    }
  });
}

function csvToRows(csv) {
  // cellDates: false garante que datas do CSV chegam como string pura (ex: "31/03/2026")
  const wb = XLSX.read(csv, { type: 'string', cellDates: false, raw: true });
  return XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1, defval: '', raw: true });
}

async function syncOnline() {
  const btn = document.getElementById('syncBtn');
  btn.innerHTML = '⏳ Sincronizando...';
  btn.disabled = true;
  btn.style.opacity = '0.7';

  try {
    const csvMain = await fetchCSV(SHEET_MAIN_URL);
    parseData(csvToRows(csvMain));

    try {
      const csvCancel = await fetchCSV(SHEET_CANCEL_URL);
      parseCancelados(csvToRows(csvCancel));
      cancelRendered = false;
    } catch(e) { /* cancelados opcional */ }

  }
}

function parseData(rows) {
  // Find header row (row with VISTORIADOR, DATA, etc.)
  let headerIdx = -1;
  for (let i = 0; i < Math.min(rows.length, 15); i++) {
    const r = rows[i].map(c => String(c).toUpperCase().trim()
      .normalize('NFD').replace(/[\u0300-\u036f]/g, '')); // remove acentos
    const hasVist = r.some(h => h.includes('VISTORIADOR') || h.includes('VISTORIADORES') || h === 'NOME');
    const hasData = r.some(h => h === 'DATA' || h.startsWith('DATA ') || h.includes('DATA'));
    if (hasVist && hasData) { headerIdx = i; break; }
  }
  if (headerIdx === -1) {
    // Diagnóstico: mostra as primeiras linhas recebidas
    const preview = rows.slice(0, 5).map((r, i) => `Linha ${i}: [${r.slice(0,8).join(' | ')}]`).join('\n');
    alert('Formato não reconhecido.\n\nPrimeiras linhas recebidas:\n' + preview + '\n\nVerifique os nomes das colunas na planilha.');
    return;
  }

  const headers = rows[headerIdx].map(c =>
    String(c).toUpperCase().trim().normalize('NFD').replace(/[\u0300-\u036f]/g, ''));
  const iV   = headers.findIndex(h => h.includes('VISTORIADOR') || h === 'NOME');
  const iD   = headers.findIndex(h => h === 'DATA' || h.startsWith('DATA'));
  const iDem = headers.findIndex(h => h.includes('DEMANDA'));
  const iEnt = headers.findIndex(h => h.includes('ENTREGA'));
  const iRes = headers.findIndex(h => h.includes('RESPONSAVEL') || h.includes('RESPONSAVEL'));
  const iReg = headers.findIndex(h => h.includes('REGIAO') || h.includes('REGI'));
  const iPro = headers.findIndex(h => h.includes('PRODUTIVA') && !h.includes('IM'));
  const iImp = headers.findIndex(h => h.includes('IMPRODUTIVA'));
  const iObs = headers.findIndex(h => h.includes('OBS'));

  rawData = [];
  for (let i = headerIdx + 1; i < rows.length; i++) {
    const row = rows[i];
    const nome = String(row[iV] || '').trim();
    if (!nome) continue;

    let dateVal = row[iD];
    let dateStr = '';
    const dateRaw = String(dateVal ?? '').trim();
    if (dateRaw) {
      // DD/MM/AAAA ou DD-MM-AAAA (formato da planilha)
      const m1 = dateRaw.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})$/);
      if (m1) {
        dateStr = `${m1[3]}-${m1[2].padStart(2,'0')}-${m1[1].padStart(2,'0')}`;
      // AAAA-MM-DD
      } else if (dateRaw.match(/^\d{4}-\d{2}-\d{2}/)) {
        dateStr = dateRaw.split('T')[0];
      // Número serial do Excel (ex: 46000)
      } else if (!isNaN(dateRaw) && Number(dateRaw) > 1000) {
        const d = XLSX.SSF.parse_date_code(Number(dateRaw));
        if (d) dateStr = `${d.y}-${String(d.m).padStart(2,'0')}-${String(d.d).padStart(2,'0')}`;
      } else {
        dateStr = dateRaw;
      }
    }

    const demanda    = parseInt(row[iDem]) || 0;
    const entrega    = parseInt(row[iEnt]) || 0;
    const produtivas = iPro >= 0 ? (parseInt(row[iPro]) || 0) : 0;
    const improd     = iImp >= 0 ? (parseInt(row[iImp]) || 0) : 0;
    const regiao     = iReg >= 0 ? String(row[iReg] || '').trim() : '';
    const resp       = iRes >= 0 ? String(row[iRes] || '').trim() : '';
    const obs        = iObs >= 0 ? String(row[iObs] || '').trim() : '';

    rawData.push({ nome, data: dateStr, demanda, entrega, produtivas, improd, regiao, resp, obs });
  }

  buildDateFilters();
  applyFilter('all');
  document.getElementById('filtersArea').style.display = 'flex';
}

let activeVistFilter = '';

function buildDateFilters() {
  const dates = [...new Set(rawData.map(r => r.data))].filter(Boolean).sort();
  if (dates.length > 0) {
    document.getElementById('dateFrom').value = dates[0];
    document.getElementById('dateTo').value = dates[dates.length - 1];
  }
  // Popula select de vistoriadores
  const sel = document.getElementById('filterVist');
  const nomes = [...new Set(rawData.map(r => r.nome))].filter(Boolean).sort();
  sel.innerHTML = '<option value="">Todos</option>' + nomes.map(n => `<option value="${n}">${n}</option>`).join('');
  activeVistFilter = '';
}

function _applyFilters() {
  const from = document.getElementById('dateFrom').value;
  const to   = document.getElementById('dateTo').value;
  filteredData = rawData.filter(r =>
    (!from || !r.data || r.data >= from) &&
    (!to   || !r.data || r.data <= to)  &&
    (!activeVistFilter || r.nome === activeVistFilter)
  );
  renderAll();
}

function applyVistFilter() {
  activeVistFilter = document.getElementById('filterVist').value;
  _applyFilters();
}

function setFilter(f) { applyFilter(f); }

function applyFilter(f) {
  activeFilter = f;
  filteredData = f === 'all' ? [...rawData] : rawData.filter(r => r.data === f);
  renderAll();
}

function applyDateRange() {
  const from = document.getElementById('dateFrom').value;
  const to   = document.getElementById('dateTo').value;
  if (!from || !to) return;
  document.querySelectorAll('.date-btn').forEach(b => b.classList.remove('active'));
  _applyFilters();
}

              const demandaCell = r.demanda > 0 ? r.demanda : `<span class="no-data">—</span>`;
              const entregaCell = r.entrega > 0 ? r.entrega : (r.demanda > 0 ? `<span style="color:var(--red)">0</span>` : `<span class="no-data">—</span>`);
              const prodCell = r.produtivas > 0 ? `<span style="color:var(--green);font-weight:600">${r.produtivas}</span>` : `<span class="no-data">—</span>`;
              const impCell  = r.improd > 0 ? `<span style="color:var(--red);font-weight:600">${r.improd}</span>` : `<span class="no-data">—</span>`;
              const obsCell  = r.obs ? `<span style="font-size:0.77rem;color:var(--yellow)">${r.obs}</span>` : `<span class="no-data">—</span>`;

              return `<tr>
                <td class="name-cell">${r.nome}</td>
                <td>${r.data ? formatDate(r.data) : '—'}</td>
                <td>${demandaCell}</td>
                <td>${entregaCell}</td>
                <td>${prodCell}</td>
                <td>${impCell}</td>
                <td style="white-space:nowrap">${pillTaxa}</td>
                <td>${r.regiao || '<span class="no-data">—</span>'}</td>
                <td style="font-size:0.77rem;color:var(--muted);line-height:1.35;max-width:160px">${r.resp || '—'}</td>
                <td style="max-width:220px;white-space:normal;line-height:1.35">${obsCell}</td>
              </tr>`;
            }).join('')}
          </tbody>
        </table>
      </div>
    </div>
  `;
}

function saveChartPNG(canvasId, filename) {
  const canvas = document.getElementById(canvasId);
  if (!canvas) return;

  const scale = 6;
  const offscreen = document.createElement('canvas');
  offscreen.width  = canvas.width  * scale;
  offscreen.height = canvas.height * scale;
  const ctx = offscreen.getContext('2d');

  // Enable best quality rendering
  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = 'high';

  // Dark background + subtle gradient matching dashboard
  const bg = ctx.createLinearGradient(0, 0, offscreen.width, offscreen.height);
  bg.addColorStop(0, '#111827');
  bg.addColorStop(1, '#0f1623');
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, offscreen.width, offscreen.height);

  // Subtle border glow
  ctx.strokeStyle = 'rgba(0,212,255,0.15)';
  ctx.lineWidth = 4;
  ctx.strokeRect(2, 2, offscreen.width - 4, offscreen.height - 4);

  // Draw chart scaled up
  ctx.drawImage(canvas, 0, 0, offscreen.width, offscreen.height);

  // Download
  const link = document.createElement('a');
  link.download = `${filename}_${new Date().toLocaleDateString('pt-BR').replace(/\//g,'-')}.png`;
  link.href = offscreen.toDataURL('image/png', 1.0);
  link.click();
}

function formatDate(d) {
  if (!d) return '—';
  const [y, m, day] = d.split('-');
  return `${day}/${m}/${y}`;
}

function _setIconColor(c1, c2) {
  const svg = document.getElementById('sidebarIcon');

  svg.querySelectorAll('.sb-line').forEach(l => l.setAttribute('stroke', c1));

// ───── CANCELADOS DATA ─────
let cancelData = [];
let filteredCancelData = [];

function parseCancelados(rows) {
  let headerIdx = -1;
  for (let i = 0; i < rows.length; i++) {
    const r = rows[i].map(c => String(c).toUpperCase().trim());
    if (r.includes('SETOR') && r.includes('VISTORIADOR') && r.includes('CANCELADA')) {
      headerIdx = i; break;
    }
  }
  if (headerIdx === -1) return;

  const headers = rows[headerIdx].map(c => String(c).toUpperCase().trim());
  const iSetor = headers.indexOf('SETOR');
  const iVist  = headers.indexOf('VISTORIADOR');
  const iMun   = headers.findIndex(h => h.includes('MUNICIPIO') || h.includes('MUNICÍPIO'));
  const iPrazo = headers.findIndex(h => h.includes('PRAZO'));
  let iData = headers.findIndex(h => h.includes('DATA VIST') || h.includes('DATA DA VIST'));
  if (iData === -1) iData = headers.findIndex(h => h.includes('DATA DA PROG') || h.includes('DATA PROG'));
  if (iData === -1) iData = headers.findIndex(h => h === 'DATA');
  if (iData === -1) iData = 8;
  const iStatus= headers.indexOf('STATUS');
  const iCanc  = headers.indexOf('CANCELADA');
  const iObs   = headers.findIndex(h => h.includes('OBSERVA'));
  const iOT    = headers.findIndex(h => h.includes('OT') || h.includes('TRABALHO'));

  cancelData = [];
  for (let i = headerIdx + 1; i < rows.length; i++) {
    const row = rows[i];
    const cancVal = String(row[iCanc] || '').toUpperCase().trim();
    if (cancVal !== 'SIM') continue;
    const nome = String(row[iVist] || '').trim();
    if (!nome) continue;

    let dateStr = '';
    const dateVal = iData >= 0 ? row[iData] : undefined;
    const dateRaw = String(dateVal ?? '').trim();
    if (dateRaw) {
      const m1 = dateRaw.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})$/);
      if (m1) {
        dateStr = `${m1[3]}-${m1[2].padStart(2,'0')}-${m1[1].padStart(2,'0')}`;
      } else if (dateRaw.match(/^\d{4}-\d{2}-\d{2}/)) {
        dateStr = dateRaw.split('T')[0];
      } else if (!isNaN(dateRaw) && Number(dateRaw) > 1000) {
        const d = XLSX.SSF.parse_date_code(Number(dateRaw));
        if (d) dateStr = `${d.y}-${String(d.m).padStart(2,'0')}-${String(d.d).padStart(2,'0')}`;
      } else {
        dateStr = dateRaw;
      }
    }

    cancelData.push({
      setor:  String(row[iSetor] || '').trim(),
      nome:   nome.trim(),
      ot:     iOT >= 0 ? String(row[iOT] || '').trim() : '',
      mun:    iMun >= 0 ? String(row[iMun] || '').trim() : '',
      data:   dateStr,
      status: iStatus >= 0 ? String(row[iStatus] || '').trim() : '',
      obs:    iObs >= 0 ? String(row[iObs] || '').trim() : '',
    });
  }
  filteredCancelData = [...cancelData];
}

function buildCancelFilterOptions() {
  const vists  = [...new Set(cancelData.map(r => r.nome))].sort();
  const setors = [...new Set(cancelData.map(r => r.setor))].filter(Boolean).sort();
  const muns   = [...new Set(cancelData.map(r => r.mun))].filter(Boolean).sort();

  const selV = document.getElementById('cfVist');
  const selS = document.getElementById('cfSetor');
  const selM = document.getElementById('cfMun');

  selV.innerHTML = '<option value="">Todos vistoriadores</option>' + vists.map(v => `<option value="${v}">${v}</option>`).join('');
  selS.innerHTML = '<option value="">Todos setores</option>'       + setors.map(s => `<option value="${s}">${s}</option>`).join('');
  selM.innerHTML = '<option value="">Todos municípios</option>'    + muns.map(m => `<option value="${m}">${m}</option>`).join('');

  // Preencher datas com o range completo dos dados
  const dates = cancelData.map(r => r.data).filter(Boolean).sort();
  if (dates.length > 0) {
    document.getElementById('cfDateFrom').value = dates[0];
    document.getElementById('cfDateTo').value   = dates[dates.length - 1];
  }

  document.getElementById('cancelFilters').style.display = 'flex';
  updateCancelCount();
}

function applyCancelFilters() {
  const fVist  = document.getElementById('cfVist').value;
  const fSetor = document.getElementById('cfSetor').value;
  const fMun   = document.getElementById('cfMun').value;
  const fFrom  = document.getElementById('cfDateFrom').value;
  const fTo    = document.getElementById('cfDateTo').value;

  filteredCancelData = cancelData.filter(r =>
    (!fVist  || r.nome  === fVist)  &&
    (!fSetor || r.setor === fSetor) &&
    (!fMun   || r.mun   === fMun)   &&
    (!fFrom  || !r.data || r.data >= fFrom) &&
    (!fTo    || !r.data || r.data <= fTo)
  );

  updateCancelCount();
  cancelRendered = false;
  renderCancelados();
  cancelRendered = true;
}

function clearCancelFilters() {
  document.getElementById('cfVist').value  = '';
  document.getElementById('cfSetor').value = '';
  document.getElementById('cfMun').value   = '';
  const dates = cancelData.map(r => r.data).filter(Boolean).sort();
  if (dates.length > 0) {
    document.getElementById('cfDateFrom').value = dates[0];
    document.getElementById('cfDateTo').value   = dates[dates.length - 1];
  }
  filteredCancelData = [...cancelData];
  updateCancelCount();
  cancelRendered = false;
  renderCancelados();
  cancelRendered = true;
}

function updateCancelCount() {
  const el = document.getElementById('cfCount');
  if (!el) return;
  const total = cancelData.length;
  const shown = filteredCancelData.length;
  el.innerHTML = shown === total
    ? `<strong>${total}</strong> registros`
    : `<strong>${shown}</strong> de ${total} registros`;
}

  const CAM_SVG_T = `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>`;
  document.getElementById('cancelTableArea').innerHTML = `
    <div class="section-divider">Registros Improdutivos com Observações</div>
    <div class="chart-card">
      <div class="chart-title" style="justify-content:space-between">
        <span style="display:flex;align-items:center;gap:8px"><span class="dot" style="background:var(--red)"></span> Tabela de Improdutivas</span>
        <button class="btn-print" onclick="saveCancelTablePNG()" title="Salvar tabela como PNG">${CAM_SVG_T}</button>
      </div>
      <div class="chart-sub">Todos os registros improdutivos e respectivos motivos</div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>#</th>
              <th>Vistoriador</th>
              <th>Setor</th>
              <th>OT / Trabalho</th>
              <th>Município</th>
              <th>Data Vistoria</th>
              <th>Motivo / Observação</th>
            </tr>
          </thead>
          <tbody>
            ${data.map((r, i) => `
              <tr>
                <td style="color:var(--muted);font-size:0.78rem">${i+1}</td>
                <td class="name-cell">${r.nome}</td>
                <td><span class="badge-pill pill-red">${r.setor || '—'}</span></td>
                <td style="color:var(--muted);font-size:0.78rem">${r.ot || '—'}</td>
                <td>${r.mun || '—'}</td>
                <td>${r.data ? formatDate(r.data) : '—'}</td>
                <td style="max-width:340px;white-space:normal;line-height:1.5;font-size:0.78rem;color:var(--yellow)">${r.obs || '<span class="no-data">Sem observação</span>'}</td>
              </tr>`).join('')}
          </tbody>
        </table>
      </div>
    </div>
  `;

  // Popula os dropdowns de filtro (só na primeira renderização completa)
  if (document.getElementById('cfVist').options.length <= 1) {
    buildCancelFilterOptions();
  } else {
    updateCancelCount();
  }
}

// On load: estado vazio aguardando upload
window.addEventListener('load', () => {
  _applyTitleGradient('main');
  document.getElementById('panelMain').classList.add('active');
  document.getElementById('panelCancel').classList.remove('active');
  document.getElementById('kpiGrid').innerHTML = `
    <div class="kpi-card blue"><div class="kpi-label">Demanda Total</div><div class="kpi-value" style="color:var(--border)">—</div><div class="kpi-sub">aguardando base</div></div>
    <div class="kpi-card orange"><div class="kpi-label">Entregas</div><div class="kpi-value" style="color:var(--border)">—</div><div class="kpi-sub">aguardando base</div></div>

    <div class="kpi-card red"><div class="kpi-label">Improdutivas</div><div class="kpi-value" style="color:var(--border)">—</div><div class="kpi-sub">aguardando base</div></div>
    <div class="kpi-card purple"><div class="kpi-label">Taxa Entrega</div><div class="kpi-value" style="color:var(--border)">—</div><div class="kpi-sub">aguardando base</div></div>
  `;
  document.getElementById('chartsArea').innerHTML = `

      <div style="font-size:3rem;margin-bottom:16px">📂</div>
      <div style="font-family:var(--font-head);font-size:1.1rem;color:var(--text);margin-bottom:8px">Nenhuma base carregada</div>

  document.getElementById('tableArea').innerHTML = '';
  document.getElementById('filtersArea').style.display = 'none';
});
</script>
</body>
